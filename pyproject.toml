[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "aethens"
version = "0.1.0"
description = "Validate the verifiers of code tasks by running them: accept correct, reject wrong, same result every run."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Aethens contributors" }]
keywords = [
  "benchmarks",
  "mutation-testing",
  "reward-hacking",
  "rl-environments",
  "testing",
  "verifiers",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0.3,<7"]

[project.urls]
Homepage = "https://beastrog.github.io/aethens/"
Repository = "https://github.com/beastrog/aethens"
Issues = "https://github.com/beastrog/aethens/issues"
Discussions = "https://github.com/beastrog/aethens/discussions"
Changelog = "https://github.com/beastrog/aethens/blob/main/CHANGELOG.md"
Author = "https://linkedin.com/in/aniruddha-dey-887b26312/"

[project.scripts]
aethens = "aethens.cli:main"

[dependency-groups]
dev = [
  "ruff==0.17.5",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "jsonschema==4.26.0",
  "types-PyYAML==6.0.12.20261113",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aethens"]

[tool.hatch.build.targets.sdist]
# Keep the marketing site out of the PyPI sdist (it is built and deployed separately).
exclude = ["website"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [
  "bench/tasks",
  "tests/fixtures",
  "bench/external/sample",
  "bench/external/full",
  "bench/external/data",
  "website",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607", "S108", "S105"]

[tool.mypy]
strict = true
python_version = "3.11"
files = [
  "src",
  "tests",
  "bench/run_bench.py",
  "bench/render_readme.py",
  "bench/external/fetch.py",
  "bench/external/convert.py",
  "bench/external/run_external.py",
  "bench/external/render_external.py",
  "bench/tbench/convert_tb2.py",
  "bench/tbench/run_tb2.py",
]
mypy_path = ["bench/external"]
exclude = ["tests/fixtures/"]

[[tool.mypy.overrides]]
# jsonschema ships no type stubs; it is only used in tests.
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".*"]
addopts = "-ra --strict-markers"
markers = ["docker: needs a working Docker daemon and the python:3.12-slim image"]
