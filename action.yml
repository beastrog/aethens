name: Aethens audit
author: Aniruddha Dey
description: >
  Run the verifiers of code tasks against the gold solution, labeled candidates and mutants, and
  report problems with evidence and repro commands. Use it on `pull_request` with read-only
  permissions; it needs no secrets.
branding:
  icon: crosshair
  color: gray-dark
inputs:
  path:
    description: Task directory (with task.yaml) or a directory of tasks, relative to the workspace.
    required: true
  budget:
    description: smoke, standard or deep.
    default: standard
  fail-on:
    description: error or warning. Findings at or above this severity fail the step.
    default: error
  seed:
    description: Seed for reproducible runs.
    default: "0"
  images:
    description: Space-separated Docker images the tasks use; pulled before the audit (runs use --pull never).
    default: python:3.12-slim
  jobs:
    description: >
      How many tasks to audit at once. Empty uses the CLI default (minimum of the CPU count and 4).
    required: false
    default: ""
  cache-dir:
    description: >
      Result cache directory. Empty uses the CLI default. GitHub-hosted runners do not keep this
      directory between workflow runs. Ignored when no-cache is true.
    required: false
    default: ""
  no-cache:
    description: If true, recompute every task and do not read or write the result cache.
    required: false
    default: "false"
  python-version:
    description: Python used to run Aethens itself (not the tasks, which run in Docker).
    default: "3.12"
outputs:
  exit-code:
    description: The aethens exit code (0 pass, 1 findings, 2 tool error, 3 timeout).
    value: ${{ steps.audit.outputs.exit-code }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Aethens from this action's checkout
      shell: bash
      env:
        AETHENS_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check "$AETHENS_ACTION_PATH"
    - name: Pull task images
      shell: bash
      env:
        AETHENS_IMAGES: ${{ inputs.images }}
      run: |
        set -euo pipefail
        for img in $AETHENS_IMAGES; do
          docker pull -- "$img"
        done
    - name: Audit
      id: audit
      shell: bash
      env:
        AETHENS_PATH: ${{ inputs.path }}
        AETHENS_BUDGET: ${{ inputs.budget }}
        AETHENS_FAIL_ON: ${{ inputs.fail-on }}
        AETHENS_SEED: ${{ inputs.seed }}
        AETHENS_JOBS: ${{ inputs.jobs }}
        AETHENS_CACHE_DIR: ${{ inputs.cache-dir }}
        AETHENS_NO_CACHE: ${{ inputs.no-cache }}
      run: |
        # GitHub runs bash with -e; keep going on findings so the summary and output are written.
        set +e
        set -uo pipefail
        args=(
          audit "$AETHENS_PATH"
          --budget "$AETHENS_BUDGET"
          --fail-on "$AETHENS_FAIL_ON"
          --seed "$AETHENS_SEED"
          --format markdown
          --output aethens-report.md
        )
        if [ -n "$AETHENS_JOBS" ]; then
          args+=(--jobs "$AETHENS_JOBS")
        fi
        if [ "$AETHENS_NO_CACHE" = "true" ]; then
          args+=(--no-cache)
        elif [ -n "$AETHENS_CACHE_DIR" ]; then
          args+=(--cache-dir "$AETHENS_CACHE_DIR")
        fi
        aethens "${args[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ -f aethens-report.md ]; then
          cat aethens-report.md >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$code"
