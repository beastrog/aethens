name: release-drafter

# Updates the next GitHub *draft* release when main moves.
# Never publishes. Creating and publishing a release is the maintainer's job
# and is what triggers .github/workflows/release.yml (PyPI).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Update release draft
        uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          disable-autolabeler: true
          publish: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
