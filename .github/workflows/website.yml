name: website

# Builds the Astro site on PRs and pushes to main that touch website/ or the bench JSON the build reads.
# Intentionally not a required ruleset check, and it does not deploy.
# Deployment stays in pages.yml (push to main / workflow_dispatch only).
on:
  pull_request:
    paths:
      - "website/**"
      - "bench/results.json"
      - "bench/external/results.json"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "bench/results.json"
      - "bench/external/results.json"
      - ".github/workflows/website.yml"

permissions:
  contents: read

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: website build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install and build
        working-directory: website
        run: |
          npm ci
          npm run build
