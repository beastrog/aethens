version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      website-npm:
        patterns:
          - "*"
    labels:
      - dependencies
    open-pull-requests-limit: 10
