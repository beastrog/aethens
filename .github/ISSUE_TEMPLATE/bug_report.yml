name: Bug report
description: Aethens crashed, gave a wrong exit code, or reported something it should not have.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste secrets. Vulnerabilities go through
        [private advisory reporting](https://github.com/beastrog/aethens/security/advisories/new),
        not this form. If Aethens flagged something incorrectly, use the false-positive template.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and the output. Do not paste secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: aethens --version
      description: Or the git commit you installed from.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, Docker version, Python version
  - type: textarea
    id: repro
    attributes:
      label: Smallest task directory that reproduces it
      description: Paste a minimal task, or a link, if you can share one.
