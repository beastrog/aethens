name: False positive
description: Report a finding Aethens got wrong, with the report JSON and a repro command.
labels: [false-positive]
body:
  - type: markdown
    attributes:
      value: |
        Use this when Aethens reported a defect that is not real. Please do not name defects in
        other people's benchmarks here before their maintainers have been told privately; see
        [docs/DISCLOSURE.md](https://github.com/beastrog/aethens/blob/main/docs/DISCLOSURE.md).
  - type: textarea
    id: finding
    attributes:
      label: The finding that was wrong
      description: Check id (C001–C007), severity, and a short summary of what Aethens claimed.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is a false positive
      description: What is actually going on, and why the verifier is fine (or why the finding is mis-attributed).
    validations:
      required: true
  - type: textarea
    id: report_json
    attributes:
      label: Report JSON
      description: Paste the relevant finding object, or the full aethens-report JSON if it is small. Redact secrets and private task source if needed.
      render: json
    validations:
      required: true
  - type: input
    id: repro
    attributes:
      label: One-line repro command
      description: The command Aethens printed, or the audit invocation that produced the finding.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: aethens --version
      description: Or the git commit you installed from.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task you can share
      description: A minimal task directory, a public repo link, or a note that the task is private.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Budget, seed, Docker version, or related logs. Do not paste secrets.
